name: Windows installer

on:
  push:
    branches: [MASD-Commissioning-Report]
    paths: ['index.html', 'manifest.json', 'sw.js', 'icons/**', 'electron/**', '.github/workflows/windows-installer.yml']
  pull_request:
    paths: ['index.html', 'manifest.json', 'sw.js', 'icons/**', 'electron/**', '.github/workflows/windows-installer.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - run: npm ci

      - name: Build NSIS installer
        run: npm run dist

      - name: Find installer
        id: exe
        shell: bash
        run: |
          f=$(ls dist/*.exe | head -n 1)
          echo "path=electron/$f" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$f")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: ${{ steps.exe.outputs.path }}
          if-no-files-found: error

      - name: Attach installer to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: gh release upload "${{ github.event.release.tag_name }}" "${{ steps.exe.outputs.path }}" --clobber --repo "${{ github.repository }}"
